name: Naver Press Popular News (Phase 1)

# Phase 2(2026-09): 정기 수집 ON. 단 **정기 실행원은 cron-job.org(외부)의
# workflow_dispatch 하나로 단일화한다** — crawl.yml 과 같은 방식이다.
#
# GitHub 자체 schedule cron 은 쓰지 않는다(2026-09 제거). 이 저장소에서 실측한 결과
# GitHub schedule 은 트리거를 대량 누락한다: healthcheck.yml 의 cron 은 "매시 :23"
# 인데 실제 발화는 2.5~6.3시간 간격이었고(07:46 / 01:30 / 23:00 / 20:13 …),
# 하루 기대 24회 중 2회만 실행됐다. 30분 주기 수집을 GitHub cron 으로 보장할 수 없다.
# crawl.yml 이 2026-07 에 같은 이유로 이미 외부 dispatch 로 전환한 선례를 따른다.
#
# cron-job.org 계약: 매시 :08 / :38 에 이 workflow 를 ref=main 으로 dispatch.
#   :17, :47  cron-job.org → crawl.yml(뉴스 키워드, full / news_top_only)
#   :23       healthcheck.yml(GitHub schedule, 불규칙)
# 위 점유 시각에서 8분 이상 떨어뜨렸다. 수집은 ~32초로 끝나 겹칠 여지가 사실상 없다.
#
# 이 workflow 는 기존 crawl.yml/healthcheck.yml 과 완전히 분리돼 있어, 실패해도
# 기존 뉴스/커뮤니티 크롤러에 영향을 주지 않는다.
#
# 수집기 계약은 그대로다: Naver HTML 1회 요청 / 403·429·challenge 즉시 fail-closed /
# 우회·프록시·CAPTCHA 대응 없음 / parser validation 실패 시 기존 cache 보존 /
# 성공할 때만 source='naver_press_popular' snapshot overwrite.
on:
  workflow_dispatch: {}      # cron-job.org(정기 :08/:38) + 수동(비상·검증) 공용 진입점

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Naver press popular collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m news_naver_press
