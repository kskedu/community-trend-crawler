name: Community Trend Crawler

# 정기 실행원은 cron-job.org(외부)의 workflow_dispatch 하나로 단일화한다.
# GitHub 자체 schedule cron은 제거했다(2026-07): cron-job.org와 동일 :17/:47·동일 모드로
# 이중 트리거되어 news_top을 연속 저장(last-write-wins)·movement 왜곡·큐 적체를 유발했다.
# cron-job.org 계약: :17 호출→mode=full, :47 호출→mode=news_top_only, ref=main.
# 백업/비상·검증은 아래 workflow_dispatch(수동 UI 또는 gh) 진입점을 그대로 쓴다.
on:
  workflow_dispatch:           # cron-job.org(정기) + 수동(비상·검증) 공용 진입점
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options:
          - full
          - news_top_only
        default: full

permissions:
  contents: read
  actions: read   # 알림 단계가 같은 workflow 의 직전 실행 결론을 조회한다(쓰기 권한 없음)

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 실행 모드 결정: workflow_dispatch 단독 진입점(정기=cron-job.org, 비상=수동).
      # inputs.mode 를 그대로 쓰되, cron-job.org 가 mode 를 생략(body={"ref":"main"})하면
      # 빈 값이 되므로 full 로 정규화한다 — main.py 는 빈 모드를 Unknown 으로 즉시 실패시키기
      # 때문이다. 허용 값은 full / news_top_only 뿐이며, 그 외/빈값은 안전하게 full 로 fallback.
      # (기존 계약 유지: :17=full, :47=news_top_only 는 cron-job.org 가 mode 로 전달한다.)
      - name: Determine run mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" != "news_top_only" ]; then
            MODE="full"
          fi
          echo "RUN_MODE=$MODE" >> "$GITHUB_OUTPUT"

      # timeout: 정상 실행은 2~3분, 2026-11-04 DB 장애 때도 13분이었다. 이보다 길면 멈춘 것으로
      # 보고 step 을 실패시킨다(기본 360분 동안 runner 를 붙잡지 않는다).
      - name: Run crawler
        id: crawl
        timeout-minutes: 20
        env:
          CRAWL_OUTCOME_PATH: ${{ runner.temp }}/crawl-outcome.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_TRENDS_ENABLED: ${{ vars.GOOGLE_TRENDS_ENABLED || 'false' }}
          GOOGLE_TRENDS_PROVIDER: ${{ vars.GOOGLE_TRENDS_PROVIDER || 'rss' }}
          NEWS_DIAG_COMPACT_FIELDS: ${{ vars.NEWS_DIAG_COMPACT_FIELDS || '' }}
          NEWS_DIAG_GROUNDING_REASON: ${{ vars.NEWS_DIAG_GROUNDING_REASON || '' }}
        run: python main.py "${{ steps.mode.outputs.RUN_MODE }}"

      # DB 저장 실패 연속 알림(ops/crawl_alert.py). 크롤러가 실패해도 돌아야 하므로 always(),
      # 알림 단계 자체의 실패가 실행 결론을 바꾸지 않도록 continue-on-error(스크립트도 항상 0).
      # 2회 연속 필수 저장 실패에 1회, 그 뒤 첫 정상 저장에 1회만 보낸다. 재실행·재시작 없음.
      - name: Alert on repeated DB save failure
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          CRAWL_OUTCOME_PATH: ${{ runner.temp }}/crawl-outcome.json
          CRAWL_STEP_OUTCOME: ${{ steps.crawl.outcome }}
          CRAWL_WORKFLOW_FILE: crawl.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m ops.crawl_alert
