name: Crawler Healthcheck

on:
  schedule:
    # 매시 23분 (정각/30분 회피, 크롤러 17분과 6분 차이로 데이터 반영 시간 확보)
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "텔레그램 알림 동작 강제 테스트"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # gh workflow run (크롤러 재실행) 위해 필요

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest community_posts timestamp
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          RES=$(curl -s "${SUPABASE_URL}/rest/v1/community_posts?select=created_at&order=created_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "Response: $RES"

          LAST_AT=$(echo "$RES" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data[0]['created_at'] if data else '')")
          if [ -z "$LAST_AT" ]; then
            echo "❌ community_posts 비어있음 — fail"
            exit 1
          fi

          # 경과 시간(분) 계산
          ELAPSED_MIN=$(python3 -c "
          from datetime import datetime, timezone
          last = datetime.fromisoformat('$LAST_AT'.replace('Z','+00:00'))
          now = datetime.now(timezone.utc)
          print(int((now - last).total_seconds() // 60))
          ")
          echo "마지막 수집: $LAST_AT (${ELAPSED_MIN}분 전)"
          echo "elapsed_min=$ELAPSED_MIN" >> $GITHUB_OUTPUT
          echo "last_at=$LAST_AT" >> $GITHUB_OUTPUT

          # 상태 분류
          if [ "$ELAPSED_MIN" -lt 120 ]; then
            echo "status=ok" >> $GITHUB_OUTPUT
          elif [ "$ELAPSED_MIN" -lt 240 ]; then
            echo "status=stale" >> $GITHUB_OUTPUT
          else
            echo "status=down" >> $GITHUB_OUTPUT
          fi

      - name: Trigger crawler (stale or down)
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 중복 dispatch 완화(check-then-act): 이미 crawl.yml 이 queued/in_progress 면
          # 재촉발하지 않는다. stale 로 보이는 건 실행 지연일 수 있어, 이미 도는 run 을
          # 기다리는 편이 이중 실행보다 안전하다. cron-job.org 정기 dispatch 와도 겹칠 수
          # 있으므로 이 방어를 둔다.
          #
          # ※ 원자적 보장이 아니다: 두 healthcheck/수동 호출이 동시에 "run 없음"을 관측하면
          #   둘 다 dispatch할 수 있고, dispatch 직후 API 리스팅 전파 지연 창도 있다.
          #   "정상 케이스 중복 완화"이며 0건 보장은 아니다(후속 concurrency/DB guard 과제).
          #
          # fail-closed: run 조회가 실패하면(네트워크/권한/일시 오류) dispatch 하지 않는다.
          #   조회 불가 상태에서 무작정 재촉발하면 이중 실행 위험이 더 크기 때문이다.
          #   이때는 다음 정기 cron-job.org dispatch 또는 다음 healthcheck 주기가 복구한다.
          # gh run list 의 --status 는 단수 문자열이라 queued/in_progress 를 각각 조회해
          # 합산한다. --workflow 는 표시 이름이 아니라 파일명(crawl.yml)으로 정확히 겨냥한다.
          # 어느 한 조회라도 실패하면 fail-closed 로 dispatch 를 생략한다.
          if ! QUEUED="$(gh run list --repo "${{ github.repository }}" \
                --workflow crawl.yml --status queued \
                --json databaseId --jq 'length' 2>/dev/null)"; then
            echo "⚠️ crawl.yml queued 조회 실패 → fail-closed: dispatch 생략(다음 주기 복구)"
            exit 0
          fi
          if ! RUNNING="$(gh run list --repo "${{ github.repository }}" \
                --workflow crawl.yml --status in_progress \
                --json databaseId --jq 'length' 2>/dev/null)"; then
            echo "⚠️ crawl.yml in_progress 조회 실패 → fail-closed: dispatch 생략(다음 주기 복구)"
            exit 0
          fi
          ACTIVE=$(( ${QUEUED:-0} + ${RUNNING:-0} ))
          if [ "$ACTIVE" != "0" ]; then
            echo "⏭️ crawl.yml 이 이미 실행 중/대기 중(queued=${QUEUED} in_progress=${RUNNING}) → dispatch 생략(중복 방지)"
            exit 0
          fi
          echo "🔄 크롤러 재실행 트리거 (status=${{ steps.check.outputs.status }}, active=0)"
          gh workflow run "Community Trend Crawler" --ref main \
            --repo ${{ github.repository }}

      - name: Send Telegram alert (down only)
        if: steps.check.outputs.status == 'down' || inputs.force_alert == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ELAPSED=${{ steps.check.outputs.elapsed_min }}
          HOURS=$((ELAPSED / 60))
          MINS=$((ELAPSED % 60))
          LAST_AT_KST=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          last = datetime.fromisoformat('${{ steps.check.outputs.last_at }}'.replace('Z','+00:00'))
          kst = last.astimezone(timezone(timedelta(hours=9)))
          print(kst.strftime('%Y-%m-%d %H:%M KST'))
          ")
          MESSAGE="🚨 [StartHub] 크롤러 이상 감지

          마지막 수집: ${LAST_AT_KST}
          경과 시간: ${HOURS}시간 ${MINS}분
          조치: 크롤러 자동 재실행 트리거됨

          GitHub: https://github.com/${{ github.repository }}/actions"

          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true
          echo ""
          echo "텔레그램 알림 전송 완료"
